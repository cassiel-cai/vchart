name: 构建和发布 vChat

on:
  push:
    tags:
      - 'v*' # 当推送以 'v' 开头的标签时触发
  workflow_dispatch: # 允许手动触发

jobs:
  build-and-publish:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建应用
        run: npm run make

      - name: 发布到 GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: vChat-${{ matrix.os }}
          path: |
            out/make/*.dmg
            out/make/*.exe
            out/make/*.deb
            out/make/*.rpm
            out/make/zip/*
          retention-days: 30
